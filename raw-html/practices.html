<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practices</title>
    <link rel="stylesheet" href="practice.css">
    <link rel="icon" href="MDC.webp" type="image/webp">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <div class="parent">
            <nav>
                <div class="navbar">
                    <!-- Logo placed inside a span with an image -->
                    <a href="home.html">
                        <span class="logo">
                            <img src="MDC.webp" alt="Your Logo">
                        </span>
                    </a>

                    <!-- Navigation Menu -->
                    <ul>
                        <li><a href="home.html">Home</a></li>
                        <li><a href="aboutus.html">About Us</a></li>
                        <li><a href="service.html">Services</a></li>
                        <li><a href="clients.html">Clients</a></li>
                        <li><a href="practices.html">Practices</a></li>
                        <li><a href="testimony.html">Testimony</a></li>
                        <li><a href="photos.html">Activity</a></li>
                        <li><a href="areacoverage.html">Area Coverage</a></li>
                        <li><a href="communityservice.html">Community Service</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </div>

    <!-- Cases Section -->
    <section class="cases">
        <h2>TYPE OF CASES</h2>
        <div class="case-list">
            <div class="case-item">
                <img src="case/civilcase.webp" alt="Civil Case">
                <p>CIVIL CASE</p>
            </div>
            <div class="case-item">
                <img src="case/criminalcase.webp" alt="Criminal Case">
                <p>CRIMINAL CASE</p>
            </div>
            <div class="case-item">
                <img src="case/foreclosure.webp" alt="Foreclosure Case">
                <p>FORECLOSURE CASE</p>
            </div>
        </div>
    </section>
    <script>
        const currentPage = location.pathname.split("/").pop(); // e.g. aboutus.html
        const navLinks = document.querySelectorAll('.navbar ul li a');

        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
            }
        });
    </script>
</body>

</html>
