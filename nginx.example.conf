server {
  listen 80;
  server_name example.com;
  root /var/www/mdebtcorporation/build;
  index index.html;

  # static assets: cache aggressively
  location /_app/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA + prerendered pages: serve file, .html, or fallback
  # 200.html is the SvelteKit SPA fallback (avoids overwriting index.html)
  location / {
    try_files $uri $uri.html $uri/ /200.html;
  }

  # optional: serve SPA shell with 200 (not 404) on unknown routes
  error_page 404 /200.html;
}
