server {
  listen 80;
  server_name example.com;
  root /var/www/mdebtcorporation/build;
  index index.html;

  # static assets: cache aggressively
  location /_app/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Prerendered pages (directory-style): serve file, directory index,
  # legacy .html, or branded fallback. Fixes 404 on reload.
  # Build outputs about-us/index.html (trailingSlash: always).
  location / {
    try_files $uri $uri/ $uri.html $uri/index.html /404.html;
  }

  # Truly unknown routes show branded page with 404 status
  error_page 404 /404.html;
}
